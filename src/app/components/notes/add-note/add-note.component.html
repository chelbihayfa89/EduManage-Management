<div *ngIf="showBanner">
  <app-banner [t]="title"></app-banner>
</div>

<div class="container-fluid pt-5">
  <div class="container">
    <div class="text-center pb-2">
      <p class="section-title px-5">
        <span class="px-2">Student Evaluation</span>
      </p>
      <h1 class="mb-4">Enter a Note and Evaluation</h1>
    </div>

    <div class="row d-flex justify-content-center">
      <div class="col-lg-7 mb-5">
        <div class="contact-form">
          <form [formGroup]="addNoteForm" (ngSubmit)="addNote()">
            <!-- Courses -->
            <div class="control-group mb-3">
              <select
                class="form-control"
                formControlName="courseId"
                (change)="onCourseChange($event)"
              >
                <option disabled selected value="">-- Select Course --</option>
                <option *ngFor="let c of courses" [value]="c._id">
                  {{ c.name }}
                </option>
              </select>
              <div
                *ngIf="
                  f['courseId'].invalid &&
                  (f['courseId'].touched || f['courseId'].dirty)
                "
              >
                <div *ngIf="f['courseId'].errors?.['required']">
                  <span class="text-danger">
                    <i class="fas fa-exclamation-triangle text-warning mr-2"></i
                    >Please select a course
                  </span>
                </div>
              </div>
            </div>

            <!-- Students -->
            <div class="control-group mb-3">
              <select class="form-control" formControlName="studentId">
                <option disabled selected value="">-- Select Student --</option>
                <option *ngFor="let s of selectedCourse?.studentsIds" [value]="s._id">
                  {{ s.firstName }}
                </option>
              </select>
              <div
                *ngIf="
                  f['studentId'].invalid &&
                  (f['studentId'].touched || f['studentId'].dirty)
                "
              >
                <div *ngIf="f['studentId'].errors?.['required']">
                  <span class="text-danger">
                    <i class="fas fa-exclamation-triangle text-warning mr-2"></i
                    >Please select a student
                  </span>
                </div>
              </div>
            </div>

            <!-- Note -->
            <div class="control-group mb-3">
              <input
                type="number"
                class="form-control"
                placeholder="Note (0 to 20)"
                name="note"
                formControlName="note"
              />
              <div
                *ngIf="
                  f['note'].invalid && (f['note'].touched || f['note'].dirty)
                "
              >
                <div *ngIf="f['note'].errors?.['required']">
                  <span class="text-danger">
                    <i class="fas fa-exclamation-triangle text-warning mr-2"></i
                    >Please enter a note (0–20)
                  </span>
                </div>
              </div>
              <div *ngIf="f['note'].errors?.['min']">
                <span class="text-danger">
                  <i class="fas fa-exclamation-triangle text-warning mr-2"></i
                  >Min: 0
                </span>
              </div>
              <div *ngIf="f['note'].errors?.['max']">
                <span class="text-danger">
                  <i class="fas fa-exclamation-triangle text-warning mr-2"></i
                  >Max: 20
                </span>
              </div>
            </div>

            <!-- Evaluation -->
            <div class="control-group mb-3">
              <input
                type="text"
                class="form-control"
                placeholder="Evaluation"
                name="evaluation"
                formControlName="evaluation"
              />
              <div
                *ngIf="
                  f['evaluation'].invalid &&
                  (f['evaluation'].touched || f['evaluation'].dirty)
                "
              >
                <div *ngIf="f['evaluation'].errors?.['required']">
                  <span class="text-danger">
                    <i class="fas fa-exclamation-triangle text-warning mr-2"></i
                    >Evaluation must be at least 5 characters long
                  </span>
                </div>
              </div>
              <div
                *ngIf="
                  f['evaluation'].invalid &&
                  (f['evaluation'].touched || f['evaluation'].dirty)
                "
              >
                <div *ngIf="f['evaluation'].errors?.['minlength']">
                  <span class="text-danger">
                    <i class="fas fa-exclamation-triangle text-warning mr-2"></i
                    >Minimum 5 characters
                  </span>
                </div>
              </div>
            </div>

            <!-- Submit -->
            <button
              class="btn btn-primary w-100 mt-3"
              type="submit"
              [disabled]="addNoteForm.invalid"
            >
              Add Note for Student
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
