<div *ngIf="showBanner">
    <app-banner [t]="title"></app-banner>
</div>

<div class="container-fluid pt-5">
  <div class="container">
    <div class="text-center pb-2">
      <p class="section-title px-5">
        <span class="px-2">Edit Speciality</span>
      </p>
      <h1 class="mb-4">Update the Speciality Name</h1>
    </div>

    <div class="row d-flex justify-content-center">
      <div class="col-lg-7 mb-5">
        <div class="contact-form">
          <form #addSpecialityF="ngForm" (ngSubmit)="updateSpeciality(addSpecialityF)">
            <!-- Speciality Name -->
            <div class="mb-3">
              <input
                type="text"
                class="form-control"
                id="sname"
                name="name"
                placeholder="Speciality Name"
                [(ngModel)]="speciality.name"
                #name="ngModel"
                required
              />
              <div *ngIf="name.invalid && (name.dirty || name.touched)">
                <small *ngIf="name.errors?.['required']" class="text-danger mt-1 mb-2 d-block">
                    <i class="fas fa-exclamation-triangle mr-2"></i>Speciality is Required!
                </small>
              </div>
            </div>

            <!-- Submit Button -->
            <div>
              <button
                class="btn btn-primary mt-3 w-100"
                type="submit"
                [disabled]="addSpecialityF.invalid"
              >
                Edit Speciality 
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
