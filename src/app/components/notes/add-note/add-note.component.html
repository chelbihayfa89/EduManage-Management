<div *ngIf="showBanner">
    <app-banner [t]="title"></app-banner>
</div>

<div class="container-fluid pt-5">
  <div class="container">
    <div class="text-center pb-2">
      <p class="section-title px-5">
        <span class="px-2">Student Evaluation</span>
      </p>
      <h1 class="mb-4">Enter a Note and Evaluation</h1>
    </div>

    <div class="row d-flex justify-content-center">
      <div class="col-lg-7 mb-5">
        <div class="contact-form">
          <form [formGroup]="addNoteForm" (ngSubmit)="addNote()">
            <!-- Courses -->
            <div class="control-group mb-3">
              <select class="form-control" formControlName="courseId" (change)="onCourseChange($event)">
                <option disabled selected>Select Course</option>
                <option *ngFor="let c of courses" [value]="c._id">{{c.name}}</option>
              </select>
              <div *ngIf="addNoteForm.controls['courseId'].invalid && (addNoteForm.controls['courseId'].touched || addNoteForm.controls['courseId'].dirty)">
                <div *ngIf="addNoteForm.controls['courseId'].errors?.['required']">
                    <span class="text-danger">
                    <i class="fas fa-exclamation-triangle text-warning mr-2"></i
                    >Course is required
                  </span>
                </div>
              </div>
            </div>

            <!-- Students -->
            <div class="control-group mb-3">
              <select class="form-control" formControlName="studentId">
                <option disabled selected>Select Student</option>
                <option *ngFor="let s of selectedCourse?.studentsIds">{{s.firstName}}</option>
              </select>
            </div>

            <!-- Note -->
            <div class="control-group mb-3">
              <input
                type="number"
                class="form-control"
                placeholder="Note (0 to 20)"
              />
            </div>

            <!-- Evaluation -->
            <div class="control-group mb-3">
              <input
                type="text"
                class="form-control"
                placeholder="Evaluation"
              />
            </div>

            <!-- Submit -->
            <button class="btn btn-primary w-100 mt-3" type="submit">
              Add Note
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
