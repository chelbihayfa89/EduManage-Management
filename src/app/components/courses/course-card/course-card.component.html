<div class="card border-0 shadow-sm mb-4 course-card">
  <!-- Course image -->
  <img
    class="card-img-top"
    src="assets/template/img/class-x.jpg"
    alt="Course image"
  />

  <!-- Card body -->
  <div class="card-body text-center">
    <h5 class="card-title text-primary">{{ c.name }}</h5>
    <p class="card-text text-muted">{{ c.description }}</p>
  </div>

  <!-- Card footer -->
  <div class="card-footer bg-white d-flex justify-content-between align-items-center">
    <!-- Course duration -->
    <span class="text-secondary">
      <i class="fas fa-clock mr-1"></i>
      <strong>{{ c.duration }}</strong> Hours
    </span>

    <!-- Optional "View details" button -->
    <button class="btn btn-sm btn-outline-primary">
      View Details
    </button>
  </div>
</div>
