<div class="container-fluid py-5">
      <div class="container">
        <div class="row d-flex justify-content-center">
          <div class="col-lg-5">
            <div class="card border-0">
              <div class="card-header bg-secondary text-center p-4">
                <h1 class="text-white m-0">Login to Your Account</h1>
              </div>
              <div class="card-body rounded-bottom bg-primary p-5">
                <form #f="ngForm" (ngSubmit)="login()">
                  <div class="form-group">
                    <input
                      type="tel"
                      class="form-control border-0 p-4"
                      placeholder="Enter your phone number"
                      name="phone"
                      [(ngModel)]="loginData.phone"
                      #phone="ngModel"
                      required
                    />
                    <div *ngIf="phone.touched && phone.invalid">
                      <div *ngIf="phone.errors?.['required']" class="text-danger">
                        Please enter your phone number
                      </div>
                    </div>
                  </div>
                  <div class="form-group">
                    <input
                      type="password"
                      class="form-control border-0 p-4"
                      placeholder="Enter your password"
                      [(ngModel)]="loginData.password"
                      #pwd="ngModel"
                      name="password"
                      required
                    />
                    <div *ngIf="pwd.touched && pwd.invalid">
                      <div *ngIf="pwd.errors?.['required']" class="text-danger">
                        Please enter your password
                      </div>
                    </div>
                  </div>
                  <div>
                    <button
                      class="btn btn-secondary btn-block border-0 py-3"
                      type="submit"
                      [disabled]="f.invalid"
                    >
                       Sign In
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
