<div *ngIf="showBanner">
    <app-banner [t]="title"></app-banner>
</div>

<div class="container-fluid pt-5">
  <div class="container">
    <div class="text-center pb-2">
      <p class="section-title px-5">
        <span class="px-2">Add a New Course</span>
      </p>
      <h1 class="mb-4">Fill in Course Details</h1>
    </div>

    <div class="row d-flex justify-content-center">
      <div class="col-lg-7 mb-5">
        <div class="contact-form">
          <form #addCourseF="ngForm" (ngSubmit)="addCourse(addCourseF)">
            <!-- Course Name -->
            <div class="mb-3">
              <input
                type="text"
                class="form-control"
                id="name"
                name="name"
                placeholder="Course Name"
                [(ngModel)]="course.name"
                #name="ngModel"
                required
              />
              <div *ngIf="name.invalid && (name.dirty || name.touched)">
                <small *ngIf="name.errors?.['required']" class="text-danger mt-1 mb-2 d-block">
                    <i class="fas fa-exclamation-triangle text-warning mr-2"></i>Course Name is Required!
                </small>
              </div>
            </div>

            <!-- Course Description -->
            <div class="mb-3">
              <input
                type="text"
                class="form-control"
                id="description"
                name="description"
                placeholder="Course Description"
                [(ngModel)]="course.description"
                #description = "ngModel"
                required=""
              />
              <div *ngIf="description.invalid && (description.dirty || description.touched)">
                <small *ngIf="description.errors?.['required']" class="text-danger mt-1 mb-2 d-block">
                    <i class="fas fa-exclamation-triangle text-warning mr-2"></i>Course Description is Required!
                </small>
              </div>
            </div>

            <!-- Course Duration -->
            <div class="mb-3">
              <input
                type="number"
                class="form-control"
                id="duration"
                name="duration"
                placeholder="Duration (hours)"
                [(ngModel)]="course.duration"
                #duration = "ngModel"
                required=""
              />
              <div *ngIf="duration.invalid && (duration.dirty || duration.touched)">
                <small *ngIf="duration.errors?.['required']" class="text-danger mt-1 mb-2 d-block">
                    <i class="fas fa-exclamation-triangle text-warning mr-2"></i>Course Duration is Required!
                </small>
              </div>
            </div>

            <!-- Submit Button -->
            <div>
              <button
                class="btn btn-primary mt-3 w-100"
                type="submit"
              >
                Add Course
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
