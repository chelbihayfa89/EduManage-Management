<div class="d-flex">
  <!-- Side bar -->
  <div class="sidebar side bg-white text-primary shadow p-3">
    <div class="d-flex align-items-center">
      <img
      [src]="student?.photo ? 'http://localhost:3000' + student?.photo : 'assets/template/img/avatar.png'"
        alt="Photo de profil"
        class="rounded-circle img-fluid"
        style="
          width: 50px;
          height: 50px;
          object-fit: cover;
          border: 2px solid #dee2e6;
        "
      />
      <h5 class="mb-0 ms-2">{{student?.firstName}} {{student?.lastName}}</h5>
    </div>
    <ul class="nav flex-column navitem w-100 mt-4">
      <li class="nav-item mb-3">
        <a class="d-flex align-items-center active side-gap" routerLink="/">
          <i class="fas fa-home text-primary"></i>
          <span>Home</span>
        </a>
      </li>
      <li class="nav-item mb-3">
        <a class="d-flex align-items-center side-gap" routerLink="/user/profile">
          <i class="fas fa-user text-primary"></i>
          <span>Profile</span>
        </a>
      </li>
      <li class="nav-item mb-3">
        <a class="d-flex align-items-center side-gap">
          <i class="fas fa-cloud-sun text-primary"></i>
          <span>Weather</span>
        </a>
      </li>
    </ul>
  </div>

  <!-- Main content -->
  <div class="content main w-100">
    <!-- Navbar -->
    <nav class="navbar bg-light border-bottom shadow-sm d-flex justify-content-between">
      <h3>Student Dashboard</h3>
      <a class="d-flex align-items-center log-out" (click)="logout()">
        <i class="fas fa-sign-out-alt text-primary me-2"></i>
        <span>Logout</span>
      </a>
    </nav>

    <!-- Courses and Notes -->
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-10">
          <div class="card shadow-sm">
            <div class="card-body d-flex">
              <!-- Liste des cours -->
              <div class="col-md-5 mb-3">
                <ul class="list-group">
                  <li *ngFor="let c of courses; 
                  let i = index" class="list-group-item" style="cursor: pointer"
                  (click)="selecteCourse(i)" [class.active] = "i === selectedCourseIndex"
                  >
                    <i class="fas fa-book me-2 text-info"></i>
                    {{c.name}}
                  </li>
                </ul>
              </div>

              <!-- Affichage des notes -->
              <div class="col-lg-5 col-md-6 pb-1">
                <div class="card text-body shadow-sm" style="border-radius: 20px">
                  <div class="card-body p-4">
                    <div class="d-flex flex-column text-center mt-1 mb-4">
                      <h2 class="mb-0 fw-bold">Note & Evaluation</h2>
                    </div>

                    <div *ngIf="selectedCourseIndex !== null">
                      <div class="d-flex align-items-center justify-content-center">
                        <div class="flex-grow-1" style="font-size: 1rem">
                          <div class="d-flex justify-content-center display-3">
                            <span [ngClass]="getNoteClass(note?.note)">{{note?.note}} </span>
                            <span>/20</span>
                          </div>
                          <hr style="border: none; background-color: #ececec; height: 3px;" />
                          <div>
                            <p class="text-center display-5"></p>
                          </div>
                        </div>
                      </div>
                    </div>
                    <div>
                      <p class="text-center"><em>{{note?.evaluation || 'Not yet graded'}}</em></p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Liste complète des cours -->
          <div class="card mt-5 shadow-sm">
            <div class="card-body">
              <div *ngIf="courses?.length === 0" class="text-center my-5 text-muted">
                <!-- No courses are available for you at the moment. -->
              </div>
              <div class="row">
                <div class="col-md-4 mb-4" *ngFor="let c of courses">
                  <app-course-card [c]="c"></app-course-card>
                </div>
              </div>
            </div>
          </div>
          
        </div>
      </div>
    </div>
  </div>
</div>
